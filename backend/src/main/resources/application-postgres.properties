# PostgreSQL (Supabase) profile, used on Cloud Run: SPRING_PROFILES_ACTIVE=postgres
#
# Supabase: use the Session pooler connection (Project > Connect > Session pooler). It is
# IPv4-compatible, which Cloud Run needs, and keeps session features that Flyway's advisory
# lock and prepared statements rely on. The direct connection is IPv6-only and the transaction
# pooler (port 6543) breaks both.
#   DATABASE_URL       jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DATABASE_USERNAME  postgres.<project-ref>
#   DATABASE_PASSWORD  the database password (keep it in Secret Manager, never commit it)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# The session pooler limits connections per database user across all Cloud Run instances.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Flyway owns the schema (db/migration/postgresql) and loads data.sql through the
# repeatable R__Seed_content migration. Hibernate only checks that the entities match.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# SPRING_AI_CHAT_MEMORY is created by the V1 migration.
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

spring.h2.console.enabled=false
spring.jpa.show-sql=false
