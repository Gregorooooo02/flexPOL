spring.application.name=backend

# Cloud Run sets PORT; locally the app listens on 8080.
server.port=${PORT:8080}
# Cloud Run does not compress responses; batch simulations are about 1 MB of JSON.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=1KB

# Default profile: H2 in-memory database for local development.
# Cloud Run / Supabase uses the 'postgres' profile (application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:flexpol
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Load data.sql on every startup, after Hibernate has created the schema
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql,classpath:demo-users.sql
spring.jpa.defer-datasource-initialization=true

# Flyway manages the PostgreSQL schema only; H2 is created by Hibernate above.
spring.flyway.enabled=false

# Spring AI / OpenAI (AI coach)
# The key comes from the OPENAI_API_KEY environment variable and is never committed.
# Without it the app still starts and the coach answers with a fallback message.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-6.1-terra}
spring.ai.openai.timeout=60s
# Only chat is used; keep the other OpenAI models switched off.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
