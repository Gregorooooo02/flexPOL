spring.application.name=backend

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:flexpol;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Load data.sql on every startup, after Hibernate has created the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Duel lifecycle, evaluation and replay (service-only; no matchmaking or network endpoints yet)
hedgeflex.duel.briefing-duration=8s
hedgeflex.duel.planning-duration=120s
hedgeflex.duel.coordinator-enabled=true
hedgeflex.duel.coordinator-delay=500ms
hedgeflex.duel.evaluation-lease=30s
hedgeflex.duel.evaluation-max-attempts=3
hedgeflex.duel.replay-lead-in=2s
hedgeflex.duel.replay-duration=10s
hedgeflex.duel.matchmaking-delay=500ms
hedgeflex.duel.matchmaking.queue-lease=30s
hedgeflex.duel.matchmaking.heartbeat-interval=10s
hedgeflex.duel.matchmaking.ticket-lease=30s
# Production: set hedgeflex.duel.matchmaking.allowed-origins to explicit HTTPS app origins.
# Never enable WebSocket/request DEBUG logging or access-log query strings: upgrade URLs carry one-use tickets.
logging.level.org.springframework.web.socket=INFO

# Spring AI / OpenAI (AI coach)
# The key comes from the OPENAI_API_KEY environment variable and is never committed.
# Without it the app still starts and the coach answers with a fallback message.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-6.1-terra}
spring.ai.openai.timeout=60s
# Only chat is used; keep the other OpenAI models switched off.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
